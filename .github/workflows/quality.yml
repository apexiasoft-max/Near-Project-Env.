name: quality

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src/npe
      - run: python -m pytest tests/unit -q
      - run: python -m pytest tests/integration tests/contract tests/e2e tests/security -q
