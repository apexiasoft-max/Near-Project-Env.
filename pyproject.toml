[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "near-project-environment"
version = "0.1.0"
description = "Local Windows workflow for producing nearby-building FBX assets"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PySide6>=6.8,<7",
  "playwright>=1.50,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pyinstaller>=6.10,<7",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
npe = "npe.main:main"
npe-api = "npe.api.app:main"
npe-worker = "npe.worker.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/npe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["npe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
